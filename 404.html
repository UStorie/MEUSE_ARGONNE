<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#120d1c">
<title>NOVARISRP - Hiérarchie RP</title>
<style>
:root{--text:#f8f3ff;--muted:#b9aacd;--accent:#a855f7;--accent2:#dfc1ff;--line:rgba(216,180,254,.30);--shadow:0 16px 45px rgba(0,0,0,.38)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 12% 7%,rgba(168,85,247,.19),transparent 31rem),linear-gradient(160deg,#08060c,#120c1b 48%,#08060c)}
button,input{font:inherit}button{cursor:pointer}.page{width:min(2600px,calc(100% - 18px));margin:auto;padding:10px 0 40px}
.topbar{position:sticky;top:7px;z-index:100;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding:14px 16px;border:1px solid var(--line);border-radius:20px;background:rgba(20,14,29,.95);box-shadow:var(--shadow);backdrop-filter:blur(15px)}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:300px}.brand-mark{width:50px;height:50px;display:grid;place-items:center;border:1px solid rgba(216,180,254,.38);border-radius:15px;background:linear-gradient(145deg,#7e22ce,#3b0764);font-weight:950}.brand-fields{min-width:0;flex:1}
.server-name,.server-subtitle,.field{width:100%;color:var(--text);border:1px solid transparent;border-radius:10px;outline:none;background:transparent}.server-name{padding:3px 0;font-size:clamp(1.25rem,3vw,1.9rem);font-weight:950}.server-subtitle{margin-top:2px;padding:3px 0;color:var(--muted);font-size:.91rem}.server-name:focus,.server-subtitle:focus,.field:focus{border-color:rgba(168,85,247,.72);background:rgba(168,85,247,.1);box-shadow:0 0 0 3px rgba(168,85,247,.11)}
.toolbar{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}.button{min-height:38px;padding:8px 11px;color:var(--text);border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.045)}.button:hover{background:rgba(168,85,247,.13)}.button.primary{background:linear-gradient(135deg,#7e22ce,#9333ea)}.button.danger:hover{background:rgba(239,68,68,.13)}
.save-status{min-height:38px;display:grid;place-items:center;padding:8px 11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;background:rgba(7,5,11,.48);font-size:.81rem}.save-status.ok{color:#bbf7d0;border-color:rgba(34,197,94,.36)}
.zoom-box{display:flex;align-items:center;gap:5px;padding:3px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.035)}.zoom-button{width:34px;height:32px;padding:0;color:var(--text);border:0;border-radius:8px;background:transparent;font-size:1.1rem;font-weight:900}.zoom-button:hover{background:rgba(168,85,247,.15)}.zoom-value{width:52px;color:var(--accent2);text-align:center;font-size:.82rem;font-weight:850}
.instructions{margin-bottom:10px;padding:11px 14px;color:var(--muted);border:1px solid var(--line);border-radius:14px;background:rgba(23,17,32,.75);text-align:center;font-size:.89rem}
.tree-viewport{min-height:65vh;overflow:auto;padding:10px 8px 60px;border:1px solid rgba(216,180,254,.10);border-radius:18px;background:rgba(255,255,255,.012)}.forest{min-width:max-content;display:flex;align-items:flex-start;justify-content:center;gap:60px;padding:10px 30px 80px;transform-origin:top center}
.empty-state{width:min(520px,calc(100vw - 50px));margin:70px auto;padding:30px;color:var(--muted);border:1px dashed var(--line);border-radius:18px;text-align:center;background:rgba(23,17,32,.76)}.empty-state strong{display:block;margin-bottom:8px;color:var(--text);font-size:1.25rem}
.branch{position:relative;display:flex;flex-direction:column;align-items:center;min-width:320px}.children{position:relative;display:flex;align-items:flex-start;justify-content:center;gap:22px;padding-top:38px}.children:before{content:"";position:absolute;top:18px;left:50%;width:calc(100% - 320px);min-width:2px;height:2px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(168,85,247,.1),var(--accent),rgba(168,85,247,.1))}.children>.branch:before{content:"";position:absolute;top:-20px;left:50%;width:2px;height:21px;transform:translateX(-50%);background:linear-gradient(var(--accent),rgba(168,85,247,.18))}
.node-card{width:320px;overflow:hidden;border:1px solid var(--line);border-radius:17px;background:rgba(23,17,32,.97);box-shadow:var(--shadow)}.node-card.root{width:390px;border-color:rgba(216,180,254,.52);background:linear-gradient(145deg,rgba(168,85,247,.21),rgba(23,17,32,.98))}.node-header{padding:12px;border-bottom:1px solid rgba(216,180,254,.16);background:linear-gradient(135deg,rgba(168,85,247,.105),rgba(255,255,255,.01))}.node-type{margin-bottom:7px;color:var(--accent2);font-size:.69rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.field{min-height:35px;padding:8px 9px;background:rgba(255,255,255,.035)}.box-title{font-size:1rem;font-weight:900}.role-title{margin-top:6px;color:var(--accent2);font-weight:750}.holder-name{margin-top:6px;color:var(--muted)}
.node-body{padding:11px}.player-control{display:grid;grid-template-columns:minmax(0,1fr) 82px;align-items:end;gap:8px;margin-bottom:10px}.control-label{display:grid;gap:4px;color:var(--muted);font-size:.71rem;font-weight:700;text-transform:uppercase}.control-label span{font-size:.66rem;text-transform:none}.count-input{min-height:35px;padding:7px 8px;color:var(--text);border:1px solid var(--line);border-radius:9px;outline:none;background:rgba(255,255,255,.045);text-align:center;font-weight:850}.players-empty{padding:9px;color:var(--muted);border:1px dashed rgba(216,180,254,.2);border-radius:9px;text-align:center;font-size:.81rem}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;max-height:330px;overflow:auto}.player-row{display:grid;grid-template-columns:27px minmax(0,1fr);align-items:center;gap:5px}.player-number{height:33px;display:grid;place-items:center;color:var(--muted);border:1px solid rgba(216,180,254,.19);border-radius:8px;background:rgba(255,255,255,.035);font-size:.66rem;font-weight:800}.player-input{min-height:33px;padding:7px 8px;font-size:.81rem}
.node-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 11px 11px;border-top:1px solid rgba(216,180,254,.14);background:rgba(0,0,0,.11)}.node-actions .button{min-height:34px;padding:7px 8px;font-size:.77rem}.add-child,.delete-node{grid-column:1/-1}.delete-node{color:#fecaca}.hidden{display:none}
@media(max-width:850px){.page{width:calc(100% - 10px)}.topbar{position:static}.brand{min-width:100%}.toolbar{justify-content:flex-start}.forest{justify-content:flex-start}.node-card{width:290px}.node-card.root{width:320px}.branch{min-width:290px}.children:before{width:calc(100% - 290px)}.players{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="page">
<header class="topbar">
<div class="brand"><div class="brand-mark">RP</div><div class="brand-fields"><input id="serverName" class="server-name"><input id="serverSubtitle" class="server-subtitle"></div></div>
<div class="toolbar">
<div id="saveStatus" class="save-status">Chargement…</div>
<div class="zoom-box"><button id="zoomOutButton" class="zoom-button" type="button">−</button><div id="zoomValue" class="zoom-value">70 %</div><button id="zoomInButton" class="zoom-button" type="button">＋</button></div>
<button id="fitButton" class="button" type="button">↔ Ajuster</button>
<button id="addPresidentButton" class="button primary" type="button">＋ Ajouter un président</button>
<button id="saveButton" class="button" type="button">💾 Sauver</button>
<button id="exportButton" class="button" type="button">⬇ JSON</button>
<button id="importButton" class="button" type="button">⬆ Importer</button>
<button id="resetButton" class="button danger" type="button">↺ Réinitialiser</button>
<input id="importFile" class="hidden" type="file" accept=".json,application/json">
</div></header>
<div class="instructions">Tous les postes commencent à <strong>0 joueur</strong>. Plusieurs présidents sont possibles. Chaque case peut avoir ses propres sous-cases.</div>
<div id="treeViewport" class="tree-viewport"><section id="forest" class="forest"></section></div>
</main>
<script>
"use strict";
const STORAGE_KEY="NOVARISRP_hierarchy_v1";
const MIN_ZOOM=.25,MAX_ZOOM=1.5,ZOOM_STEP=.10;
let saveTimer=null;
function createId(){return crypto&&crypto.randomUUID?crypto.randomUUID():"node-"+Date.now()+"-"+Math.random().toString(16).slice(2)}
function createNode(boxTitle,roleTitle,holderName,children=[]){return{id:createId(),boxTitle,roleTitle,holderName,players:[],children}}
function createDefaultState(){return{serverName:"NOVARISRP",serverSubtitle:"Organigramme officiel du gouvernement",zoom:.70,roots:[createNode("Présidence","Président","Nom à définir",[createNode("Ministère des Armées","Ministre des Armées","Nom à définir",[createNode("Gendarmerie","Chef gendarme","Nom à définir"),createNode("Police","Chef de la police","Nom à définir"),createNode("Armée","Chef des armées","Nom à définir")]),createNode("Ministère des Services publics","Ministre des Services publics","Nom à définir",[createNode("EMS","Chef des secours","Nom à définir"),createNode("Pompiers","Chef des pompiers","Nom à définir"),createNode("Voirie","Chef de la voirie","Nom à définir")]),createNode("Ministère des Affaires gouvernementales","Ministre des Affaires gouvernementales","Nom à définir",[createNode("Fiscalité","Chef de la fiscalité","Nom à définir"),createNode("Banque d'État","Directeur de la banque d'État","Nom à définir")])])]}}
function normalizeZoom(v){v=Number(v);return Number.isFinite(v)?Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,v)):.70}
function normalizeNode(raw,used){raw=raw&&typeof raw==="object"?raw:{};let id=typeof raw.id==="string"&&raw.id?raw.id:createId();while(used.has(id))id=createId();used.add(id);return{id,boxTitle:typeof raw.boxTitle==="string"?raw.boxTitle:"Nouvelle case",roleTitle:typeof raw.roleTitle==="string"?raw.roleTitle:"Nouveau poste",holderName:typeof raw.holderName==="string"?raw.holderName:"Nom à définir",players:Array.isArray(raw.players)?raw.players.slice(0,200).map(v=>typeof v==="string"?v:""):[],children:Array.isArray(raw.children)?raw.children.map(c=>normalizeNode(c,used)):[]}}
function normalizeState(raw){const d=createDefaultState();if(!raw||typeof raw!=="object")return d;const used=new Set();let roots=Array.isArray(raw.roots)?raw.roots:(raw.root?[raw.root]:[]);return{serverName:typeof raw.serverName==="string"?raw.serverName:d.serverName,serverSubtitle:typeof raw.serverSubtitle==="string"?raw.serverSubtitle:d.serverSubtitle,zoom:normalizeZoom(raw.zoom),roots:roots.map(r=>normalizeNode(r,used))}}
function loadState(){try{const s=localStorage.getItem(STORAGE_KEY);return s?normalizeState(JSON.parse(s)):createDefaultState()}catch(e){console.error(e);return createDefaultState()}}
let state=loadState();
function locateInChildren(id,parent){for(let i=0;i<parent.children.length;i++){const child=parent.children[i];if(child.id===id)return{node:child,parent,collection:parent.children,index:i,isRoot:false};const nested=locateInChildren(id,child);if(nested)return nested}return null}
function locateNode(id){for(let i=0;i<state.roots.length;i++){const root=state.roots[i];if(root.id===id)return{node:root,parent:null,collection:state.roots,index:i,isRoot:true};const nested=locateInChildren(id,root);if(nested)return nested}return null}
function setSaveStatus(text,ok){const el=document.getElementById("saveStatus");el.textContent=text;el.classList.toggle("ok",!!ok)}
function saveState(show){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));setSaveStatus(show?"Sauvegardé ✓":"Sauvegarde auto ✓",true)}catch(e){console.error(e);setSaveStatus("Erreur de sauvegarde",false)}}
function scheduleSave(){clearTimeout(saveTimer);setSaveStatus("Modification…",false);saveTimer=setTimeout(()=>saveState(false),350)}
function setZoom(v,save=true){state.zoom=normalizeZoom(v);document.getElementById("forest").style.zoom=String(state.zoom);document.getElementById("zoomValue").textContent=Math.round(state.zoom*100)+" %";if(save)saveState(false)}
function fitToScreen(){const viewport=document.getElementById("treeViewport"),forest=document.getElementById("forest");forest.style.zoom="1";requestAnimationFrame(()=>{const natural=Math.max(forest.scrollWidth,forest.getBoundingClientRect().width),available=Math.max(300,viewport.clientWidth-30);setZoom(natural>0?Math.max(MIN_ZOOM,Math.min(1,available/natural)):state.zoom,true);viewport.scrollLeft=0})}
function textInput(cls,value,label,onInput){const input=document.createElement("input");input.type="text";input.className="field "+cls;input.value=value;input.setAttribute("aria-label",label);input.addEventListener("input",()=>{onInput(input.value);scheduleSave()});return input}
function updatePlayerCount(node,value){let n=parseInt(value,10);n=Number.isFinite(n)?Math.max(0,Math.min(200,n)):0;if(n>node.players.length)while(node.players.length<n)node.players.push("Joueur "+(node.players.length+1));else if(n<node.players.length)node.players.splice(n);saveState(false);render()}
function addPresident(){const p=createNode("Présidence","Président","Nom à définir");state.roots.push(p);saveState(false);render();requestAnimationFrame(()=>document.querySelector('[data-node-id="'+p.id+'"]')?.scrollIntoView({behavior:"smooth",block:"center",inline:"center"}))}
function addChild(parentId){const loc=locateNode(parentId);if(!loc){alert("Le poste parent est introuvable.");render();return}const child=createNode("Nouvelle case","Nouveau poste","Nom à définir");loc.node.children.push(child);saveState(false);render();requestAnimationFrame(()=>document.querySelector('[data-node-id="'+child.id+'"]')?.scrollIntoView({behavior:"smooth",block:"center",inline:"center"}))}
function countDescendants(node){return node.children.reduce((total,child)=>total+1+countDescendants(child),0)}
function deleteNode(id){const loc=locateNode(id);if(!loc){alert("Cette case n'existe plus. La page a été actualisée.");render();return}const d=countDescendants(loc.node);const msg=d>0?'Supprimer "'+(loc.node.boxTitle||"Sans nom")+'" ainsi que ses '+d+' case(s) dépendante(s) ?':'Supprimer le poste "'+(loc.node.boxTitle||"Sans nom")+'" ?';if(!confirm(msg))return;const fresh=locateNode(id);if(!fresh){render();return}fresh.collection.splice(fresh.index,1);saveState(false);render()}
function moveNode(id,direction){const loc=locateNode(id);if(!loc)return;const target=loc.index+direction;if(target<0||target>=loc.collection.length)return;const moved=loc.collection.splice(loc.index,1)[0];loc.collection.splice(target,0,moved);saveState(false);render()}
function renderPlayers(node){if(node.players.length===0){const e=document.createElement("div");e.className="players-empty";e.textContent="0 joueur dans cette case";return e}const players=document.createElement("div");players.className="players";node.players.forEach((name,i)=>{const row=document.createElement("div");row.className="player-row";const num=document.createElement("div");num.className="player-number";num.textContent=String(i+1).padStart(2,"0");const input=textInput("player-input",name,"Nom du joueur",v=>node.players[i]=v);row.append(num,input);players.append(row)});return players}
function renderNode(node,isRoot){const branch=document.createElement("div");branch.className="branch";branch.dataset.nodeId=node.id;const card=document.createElement("article");card.className="node-card"+(isRoot?" root":"");const header=document.createElement("div");header.className="node-header";const type=document.createElement("div");type.className="node-type";type.textContent=isRoot?"Président / sommet":"Poste dépendant";header.append(type,textInput("box-title",node.boxTitle,"Nom de la case",v=>node.boxTitle=v),textInput("role-title",node.roleTitle,"Nom du poste",v=>node.roleTitle=v),textInput("holder-name",node.holderName,"Nom de la personne",v=>node.holderName=v));const body=document.createElement("div");body.className="node-body";const control=document.createElement("div");control.className="player-control";const label=document.createElement("label");label.className="control-label";label.innerHTML="Nombre de joueurs<span>0 à 200</span>";const count=document.createElement("input");count.type="number";count.className="count-input";count.min="0";count.max="200";count.value=String(node.players.length);count.addEventListener("change",()=>updatePlayerCount(node,count.value));control.append(label,count);body.append(control,renderPlayers(node));const actions=document.createElement("div");actions.className="node-actions";const add=document.createElement("button");add.className="button primary add-child";add.textContent="＋ Ajouter une case dessous";add.onclick=()=>addChild(node.id);const left=document.createElement("button");left.className="button";left.textContent="← Gauche";left.onclick=()=>moveNode(node.id,-1);const right=document.createElement("button");right.className="button";right.textContent="Droite →";right.onclick=()=>moveNode(node.id,1);const del=document.createElement("button");del.className="button danger delete-node";del.textContent=isRoot?"🗑 Supprimer ce président":"🗑 Supprimer ce poste";del.onclick=()=>deleteNode(node.id);actions.append(add,left,right,del);card.append(header,body,actions);branch.append(card);if(node.children.length){const children=document.createElement("div");children.className="children";node.children.forEach(child=>children.append(renderNode(child,false)));branch.append(children)}return branch}
function render(){document.getElementById("serverName").value=state.serverName;document.getElementById("serverSubtitle").value=state.serverSubtitle;const forest=document.getElementById("forest");forest.replaceChildren();if(!state.roots.length){const empty=document.createElement("div");empty.className="empty-state";empty.innerHTML="<strong>Aucun président</strong>Clique sur Ajouter un président pour recommencer.";forest.append(empty)}else state.roots.forEach(root=>forest.append(renderNode(root,true)));setZoom(state.zoom,false)}
function exportJson(){saveState(false);const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="hierarchie-rp-organigramme.json";document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url)}
function importJson(file){const reader=new FileReader();reader.onload=e=>{try{state=normalizeState(JSON.parse(String(e.target.result)));saveState(true);render();alert("Hiérarchie importée avec succès.")}catch(err){console.error(err);alert("Le fichier JSON est invalide.")}};reader.readAsText(file,"utf-8")}
document.getElementById("serverName").addEventListener("input",e=>{state.serverName=e.target.value;scheduleSave()});document.getElementById("serverSubtitle").addEventListener("input",e=>{state.serverSubtitle=e.target.value;scheduleSave()});document.getElementById("zoomOutButton").onclick=()=>setZoom(state.zoom-ZOOM_STEP);document.getElementById("zoomInButton").onclick=()=>setZoom(state.zoom+ZOOM_STEP);document.getElementById("fitButton").onclick=fitToScreen;document.getElementById("addPresidentButton").onclick=addPresident;document.getElementById("saveButton").onclick=()=>saveState(true);document.getElementById("exportButton").onclick=exportJson;document.getElementById("importButton").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").onchange=e=>{const file=e.target.files?.[0];if(file)importJson(file);e.target.value=""};document.getElementById("resetButton").onclick=()=>{if(confirm("Réinitialiser toute la hiérarchie ? Tous les joueurs repartiront à 0.")){state=createDefaultState();saveState(true);render()}};document.getElementById("treeViewport").addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();setZoom(state.zoom+(e.deltaY>0?-ZOOM_STEP:ZOOM_STEP))},{passive:false});
render();saveState(false);
</script>
</body>
</html>
