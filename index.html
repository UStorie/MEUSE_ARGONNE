<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120d1c"><title>NOVARISRP</title><style>
:root{--t:#f8f3ff;--m:#b9aacd;--a:#a855f7;--a2:#dfc1ff;--l:#d8b4fe4d;--p:#171120}*{box-sizing:border-box}body{margin:0;color:var(--t);font-family:system-ui,sans-serif;background:radial-gradient(circle at 10% 5%,#a855f733,transparent 28rem),#09070e}button,input{font:inherit}.page{width:min(2400px,calc(100% - 12px));margin:auto;padding:8px 0 40px}.bar{position:sticky;top:5px;z-index:9;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border:1px solid var(--l);border-radius:16px;background:#140e1df2;box-shadow:0 12px 35px #0007}.brand{display:flex;gap:10px;align-items:center;flex:1;min-width:270px}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#7e22ce,#3b0764);font-weight:900}.brandbox{flex:1}.name,.sub,.field{width:100%;color:var(--t);border:1px solid transparent;border-radius:9px;outline:0;background:transparent}.name{font-size:1.55rem;font-weight:900}.sub{color:var(--m)}.field{padding:7px 8px;background:#ffffff09}.field:focus,.name:focus,.sub:focus{border-color:#a855f7aa;background:#a855f719}.tools{display:flex;flex-wrap:wrap;gap:6px}.btn{padding:8px 10px;color:var(--t);border:1px solid var(--l);border-radius:9px;background:#ffffff0b;cursor:pointer}.btn:hover{background:#a855f722}.primary{background:linear-gradient(135deg,#7e22ce,#9333ea)}.danger{color:#fecaca}.status{display:grid;place-items:center;padding:8px 10px;border:1px solid var(--l);border-radius:99px;color:var(--m);font-size:.8rem}.status.ok{color:#bbf7d0;border-color:#22c55e66}.status.err{color:#fecaca;border-color:#ef444477}.zoom{display:flex;align-items:center;border:1px solid var(--l);border-radius:9px}.zoom button{width:32px;height:34px;border:0;color:var(--t);background:transparent}.zoom span{width:48px;text-align:center;font-size:.78rem;color:var(--a2)}.info{margin:9px 0;padding:10px;border:1px solid var(--l);border-radius:12px;color:var(--m);text-align:center;background:#171120bb}.view{min-height:65vh;overflow:auto;border:1px solid #d8b4fe1a;border-radius:15px;padding:12px}.forest{min-width:max-content;display:flex;justify-content:center;align-items:flex-start;gap:55px;padding:10px 25px 70px;transform-origin:top center}.branch{position:relative;display:flex;flex-direction:column;align-items:center;min-width:300px}.children{position:relative;display:flex;align-items:flex-start;justify-content:center;gap:18px;padding-top:36px}.children:before{content:"";position:absolute;top:17px;left:50%;width:calc(100% - 300px);height:2px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--a),transparent)}.children>.branch:before{content:"";position:absolute;top:-19px;left:50%;width:2px;height:20px;background:var(--a)}.card{width:300px;overflow:hidden;border:1px solid var(--l);border-radius:15px;background:#171120fa;box-shadow:0 13px 35px #0007}.card.root{width:360px;border-color:#d8b4fe80;background:linear-gradient(145deg,#a855f733,#171120fa)}.head,.body,.actions{padding:10px}.head{border-bottom:1px solid #d8b4fe26}.type{margin-bottom:6px;color:var(--a2);font-size:.67rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.title{font-weight:900}.role{margin-top:5px;color:var(--a2)}.holder{margin-top:5px;color:var(--m)}.countrow{display:grid;grid-template-columns:1fr 75px;gap:7px;align-items:end;margin-bottom:8px;color:var(--m);font-size:.72rem;text-transform:uppercase}.count{padding:7px;color:var(--t);border:1px solid var(--l);border-radius:8px;background:#ffffff0b;text-align:center}.empty{padding:8px;border:1px dashed #d8b4fe33;border-radius:8px;color:var(--m);text-align:center;font-size:.8rem}.players{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:300px;overflow:auto}.player{display:grid;grid-template-columns:25px 1fr;gap:4px}.num{display:grid;place-items:center;border:1px solid #d8b4fe2b;border-radius:7px;color:var(--m);font-size:.65rem}.pname{padding:6px;font-size:.8rem}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;border-top:1px solid #d8b4fe22}.actions .btn{padding:7px;font-size:.75rem}.wide{grid-column:1/-1}.none{display:none}@media(max-width:800px){.bar{position:static}.brand{min-width:100%}.forest{justify-content:flex-start}.players{grid-template-columns:1fr}.card{width:280px}.card.root{width:310px}.branch{min-width:280px}.children:before{width:calc(100% - 280px)}}
</style></head><body><main class="page"><header class="bar"><div class="brand"><div class="logo">RP</div><div class="brandbox"><input id="serverName" class="name"><input id="serverSubtitle" class="sub"></div></div><div class="tools"><div id="status" class="status">Chargement…</div><div class="zoom"><button id="minus">−</button><span id="zoomText">70 %</span><button id="plus">＋</button></div><button id="fit" class="btn">↔ Ajuster</button><button id="addRoot" class="btn primary">＋ Président</button><button id="save" class="btn">💾 Sauver</button><button id="export" class="btn">⬇ JSON</button><button id="import" class="btn">⬆ Importer</button><button id="reset" class="btn danger">↺ Reset</button><input id="file" class="none" type="file" accept=".json,application/json"></div></header><div class="info">La sauvegarde est automatique. Le bouton <b>Sauver</b> crée deux copies dans ce téléphone. Elle reste locale à cet appareil.</div><div id="view" class="view"><section id="forest" class="forest"></section></div></main><script>
"use strict";
const K="NOVARISRP_hierarchy_v2",B="NOVARISRP_hierarchy_backup_v2",OLD="NOVARISRP_hierarchy_v1",MIN=.25,MAX=1.5,STEP=.1;let timer=null,state;
const serverName=document.getElementById("serverName"),serverSubtitle=document.getElementById("serverSubtitle"),status=document.getElementById("status"),minus=document.getElementById("minus"),plus=document.getElementById("plus"),zoomText=document.getElementById("zoomText"),fit=document.getElementById("fit"),addRoot=document.getElementById("addRoot"),save=document.getElementById("save"),exportButton=document.getElementById("export"),importButton=document.getElementById("import"),reset=document.getElementById("reset"),file=document.getElementById("file"),view=document.getElementById("view"),forest=document.getElementById("forest");
const id=()=>globalThis.crypto?.randomUUID?.()||Date.now()+"-"+Math.random();
const node=(box,role,holder,children=[])=>({id:id(),boxTitle:box,roleTitle:role,holderName:holder,players:[],children});
function defaults(){return{serverName:"NOVARISRP",serverSubtitle:"Organigramme officiel du gouvernement",zoom:.7,roots:[node("Présidence","Président","Nom à définir",[node("Ministère des Armées","Ministre des Armées","Nom à définir",[node("Gendarmerie","Chef gendarme","Nom à définir"),node("Police","Chef de la police","Nom à définir"),node("Armée","Chef des armées","Nom à définir")]),node("Ministère des Services publics","Ministre des Services publics","Nom à définir",[node("EMS","Chef des secours","Nom à définir"),node("Pompiers","Chef des pompiers","Nom à définir"),node("Voirie","Chef de la voirie","Nom à définir")]),node("Ministère des Affaires gouvernementales","Ministre des Affaires gouvernementales","Nom à définir",[node("Fiscalité","Chef de la fiscalité","Nom à définir"),node("Banque d'État","Directeur de la banque d'État","Nom à définir")])])]}}
const clamp=z=>Math.max(MIN,Math.min(MAX,Number(z)||.7));
function cleanNode(x,used){x=x&&typeof x==="object"?x:{};let n=x.id||id();while(used.has(n))n=id();used.add(n);return{id:n,boxTitle:typeof x.boxTitle==="string"?x.boxTitle:"Nouvelle case",roleTitle:typeof x.roleTitle==="string"?x.roleTitle:"Nouveau poste",holderName:typeof x.holderName==="string"?x.holderName:"Nom à définir",players:Array.isArray(x.players)?x.players.slice(0,200).map(v=>typeof v==="string"?v:""):[],children:Array.isArray(x.children)?x.children.map(c=>cleanNode(c,used)):[]}}
function clean(x){const d=defaults(),used=new Set(),roots=Array.isArray(x?.roots)?x.roots:(x?.root?[x.root]:d.roots);return{serverName:typeof x?.serverName==="string"?x.serverName:d.serverName,serverSubtitle:typeof x?.serverSubtitle==="string"?x.serverSubtitle:d.serverSubtitle,zoom:clamp(x?.zoom),roots:roots.map(r=>cleanNode(r,used))}}
function unpack(raw){if(!raw)return null;try{const x=JSON.parse(raw);return x&&x.data&&x.time?x:{time:0,data:x}}catch{return null}}
function load(){let a=unpack(localStorage.getItem(K)),b=unpack(localStorage.getItem(B));if(!a&&!b){const old=unpack(localStorage.getItem(OLD));if(old)return clean(old.data)}const best=!a?b:!b?a:(a.time>=b.time?a:b);return clean(best?.data||defaults())}
function mark(text,mode=""){status.textContent=text;status.className="status"+(mode?" "+mode:"")}
function store(show=false){clearTimeout(timer);try{const pack=JSON.stringify({time:Date.now(),data:state});localStorage.setItem(K,pack);localStorage.setItem(B,pack);if(localStorage.getItem(K)!==pack)throw Error("Vérification impossible");mark(show?"Sauvegardé sur cet appareil ✓":"Sauvegarde auto ✓","ok");return true}catch(e){console.error(e);mark("Sauvegarde bloquée","err");if(show)alert("Le navigateur bloque la sauvegarde. Vérifie que tu n'es pas en navigation privée.");return false}}
function later(){clearTimeout(timer);mark("Modification…");timer=setTimeout(()=>store(false),300)}
function zoom(z,saveIt=true){state.zoom=clamp(z);forest.style.zoom=state.zoom;zoomText.textContent=Math.round(state.zoom*100)+" %";if(saveIt)later()}
function input(cls,val,cb){const e=document.createElement("input");e.className="field "+cls;e.value=val;e.addEventListener("input",()=>{cb(e.value);later()});return e}
function locateChild(want,p){for(let i=0;i<p.children.length;i++){const c=p.children[i];if(c.id===want)return{node:c,list:p.children,index:i};const r=locateChild(want,c);if(r)return r}return null}
function locate(want){for(let i=0;i<state.roots.length;i++){const r=state.roots[i];if(r.id===want)return{node:r,list:state.roots,index:i};const x=locateChild(want,r);if(x)return x}return null}
function setCount(n,v){v=Math.max(0,Math.min(200,parseInt(v,10)||0));while(n.players.length<v)n.players.push("Joueur "+(n.players.length+1));if(n.players.length>v)n.players.splice(v);store();render()}
function addPresident(){const p=node("Présidence","Président","Nom à définir");state.roots.push(p);store();render()}
function addChild(pid){const p=locate(pid);if(!p)return;const c=node("Nouvelle case","Nouveau poste","Nom à définir");p.node.children.push(c);store();render()}
const descendants=n=>n.children.reduce((s,c)=>s+1+descendants(c),0);
function removeNode(nid){const x=locate(nid);if(!x)return;const d=descendants(x.node),q=d?`Supprimer « ${x.node.boxTitle} » et ses ${d} sous-case(s) ?`:`Supprimer « ${x.node.boxTitle} » ?`;if(!confirm(q))return;const fresh=locate(nid);if(!fresh)return;fresh.list.splice(fresh.index,1);store();render()}
function move(nid,dir){const x=locate(nid);if(!x)return;const to=x.index+dir;if(to<0||to>=x.list.length)return;const n=x.list.splice(x.index,1)[0];x.list.splice(to,0,n);store();render()}
function playerList(n){if(!n.players.length){const e=document.createElement("div");e.className="empty";e.textContent="0 joueur";return e}const list=document.createElement("div");list.className="players";n.players.forEach((v,i)=>{const row=document.createElement("div");row.className="player";const num=document.createElement("div");num.className="num";num.textContent=String(i+1).padStart(2,"0");row.append(num,input("pname",v,x=>n.players[i]=x));list.append(row)});return list}
function card(n,root){const branch=document.createElement("div");branch.className="branch";const c=document.createElement("article");c.className="card"+(root?" root":"");const h=document.createElement("div");h.className="head";const type=document.createElement("div");type.className="type";type.textContent=root?"Président / sommet":"Poste dépendant";h.append(type,input("title",n.boxTitle,x=>n.boxTitle=x),input("role",n.roleTitle,x=>n.roleTitle=x),input("holder",n.holderName,x=>n.holderName=x));const b=document.createElement("div");b.className="body";const cr=document.createElement("div");cr.className="countrow";const lab=document.createElement("div");lab.innerHTML="Nombre de joueurs<br><small>0 à 200</small>";const cnt=document.createElement("input");cnt.type="number";cnt.className="count";cnt.min=0;cnt.max=200;cnt.value=n.players.length;cnt.onchange=()=>setCount(n,cnt.value);cr.append(lab,cnt);b.append(cr,playerList(n));const a=document.createElement("div");a.className="actions";const add=button("＋ Case dessous","btn primary wide",()=>addChild(n.id)),left=button("← Gauche","btn",()=>move(n.id,-1)),right=button("Droite →","btn",()=>move(n.id,1)),del=button(root?"🗑 Supprimer président":"🗑 Supprimer poste","btn danger wide",()=>removeNode(n.id));a.append(add,left,right,del);c.append(h,b,a);branch.append(c);if(n.children.length){const kids=document.createElement("div");kids.className="children";n.children.forEach(x=>kids.append(card(x,false)));branch.append(kids)}return branch}
function button(text,cls,fn){const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=text;b.onclick=fn;return b}
function render(){serverName.value=state.serverName;serverSubtitle.value=state.serverSubtitle;forest.replaceChildren();if(!state.roots.length){const e=document.createElement("div");e.className="empty";e.innerHTML="<strong>Aucun président</strong><br>Clique sur + Président.";forest.append(e)}else state.roots.forEach(r=>forest.append(card(r,true)));zoom(state.zoom,false)}
function exportJson(){store();const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="NOVARISRP-sauvegarde.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}
function importJson(f){const r=new FileReader();r.onload=e=>{try{state=clean(JSON.parse(e.target.result));store(true);render()}catch{alert("JSON invalide")}};r.readAsText(f)}
state=load();serverName.oninput=e=>{state.serverName=e.target.value;later()};serverSubtitle.oninput=e=>{state.serverSubtitle=e.target.value;later()};minus.onclick=()=>zoom(state.zoom-STEP);plus.onclick=()=>zoom(state.zoom+STEP);fit.onclick=()=>{forest.style.zoom=1;requestAnimationFrame(()=>zoom(Math.min(1,(view.clientWidth-20)/Math.max(1,forest.scrollWidth))))};addRoot.onclick=addPresident;save.onclick=()=>store(true);exportButton.onclick=exportJson;importButton.onclick=()=>file.click();file.onchange=e=>{if(e.target.files[0])importJson(e.target.files[0]);e.target.value=""};reset.onclick=()=>{if(confirm("Tout réinitialiser ?")){state=defaults();store(true);render()}};addEventListener("pagehide",()=>store());document.addEventListener("visibilitychange",()=>{if(document.hidden)store()});render();mark("Sauvegarde restaurée ✓","ok");
</script></body></html>
